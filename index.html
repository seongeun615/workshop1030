<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>이 TMI의 주인공은 누구?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#2b2140;--pri:#ff4f81;--sec:#7c4dff;--ok:#1db954;--mut:#8a7fa3;--line:#eadfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1530;--card:#2a2045;--ink:#fff3d6;--mut:#b5a8d6;--line:#41346a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1530;--card:#2a2045;--ink:#fff3d6;--mut:#b5a8d6;--line:#41346a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:28px;text-align:center;margin:8px 0}h2{font-size:22px;margin:6px 0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;margin:14px 0;box-shadow:5px 5px 0 var(--ink);animation:pop .4s}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.big{font-size:26px;line-height:1.4;text-align:center;word-break:keep-all}
button,select,textarea{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:14px;background:var(--card);color:var(--ink);margin:6px 0}
button{background:var(--pri);color:#fff;cursor:pointer;font-size:20px}button.alt{background:var(--sec)}button.sel{background:var(--ok)}button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{background:var(--card);color:var(--ink);font-size:18px;padding:12px;margin:0}.grid button.sel{background:var(--ok);color:#fff}
.bar{height:14px;border:2px solid var(--ink);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.mut{color:var(--mut);font-size:15px}.timer{font-size:44px;text-align:center;color:var(--pri)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.win{font-size:34px;text-align:center;animation:pop .6s}.ok{color:var(--ok)}.no{color:var(--pri)}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.adm{border-style:dashed}
</style></head><body><main id="app"><h1>🕵️ 로딩 중…</h1></main>
<script>
function sha256(s){const K=[],H=[];let k=0;for(let c=2;k<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d==0){p=0;break}if(p){K[k]=Math.floor(Math.cbrt(c)%1*4294967296);if(k<8)H[k]=Math.floor(Math.sqrt(c)%1*4294967296);k++}}
const b=[];for(let i=0;i<s.length;i++)b.push(s.charCodeAt(i));const l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
const rr=(x,n)=>(x>>>n)|(x<<(32-n));let h=H.slice();
for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
let[a,bb,c,d,e,f,g,hh]=h;
for(let i=0;i<64;i++){const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
h=[h[0]+a,h[1]+bb,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x|0)}
return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const $=id=>document.getElementById(id),app=$("app"),L=localStorage;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
let me=JSON.parse(L.me||"null"),S=null,sel=null,adm=sessionStorage.adm||"",t0=0,sentRev=false,conf=false,lastQ=-1;
async function api(p,b,h){try{const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"content-type":"application/json",...(h||{})},body:b?JSON.stringify(b):undefined});return{ok:r.ok,d:await r.json()}}catch{return{ok:false,d:{e:"네트워크 오류"}}}}
async function poll(){const r=await api("state?n="+encodeURIComponent(me?me.name:"")+"&t="+(me?me.token:""));
  if(r.ok){S=r.d;t0=Date.now();
    if(me&&S.phase==="collect"&&!S.submitted.includes(me.name)){delete L.me;me=null;sentRev=false;conf=false}
    render()}}
async function submit(){const name=$("nm").value,text=$("tx").value.trim();
  if(!name||text.length<2)return alert("이름과 TMI를 입력해 주세요");
  $("sb").disabled=true;const c=await api("claim",{name});if(!c.ok){$("sb").disabled=false;return alert(c.d.e)}
  const tmiId=rnd(),salt=rnd();me={name,token:c.d.token,tmiId,salt};L.me=JSON.stringify(me);
  const r=await api("tmi",{text,tmiId,ticket:c.d.ticket,commit:sha256(tmiId+"|"+encodeURIComponent(name)+"|"+salt)});
  if(!r.ok)alert(r.d.e+" — 관리자에게 초기화를 요청해 주세요");poll()}
async function pick(){if(!sel)return;const r=await api("answer",{n:me.name,t:me.token,pick:sel});if(!r.ok)alert(r.d.e);sel=null;poll()}
async function admin(a){if(!adm){adm=prompt("관리자 비밀번호")||"";sessionStorage.adm=adm}
  if((a==="reset"||a==="reveal")&&!confirm(a==="reset"?"전체 초기화: 모든 데이터가 삭제됩니다":"정답을 공개할까요? 되돌릴 수 없어요"))return;
  const r=await api("admin/"+a,{},{"x-admin":adm});if(!r.ok){alert(r.d.e);if(r.d.e&&r.d.e.includes("비밀번호")){adm="";sessionStorage.adm=""}}poll()}
function adminBox(h){return h+`<div class="card adm"><h2>🔧 관리자</h2>${h===""?"":""}`}
function render(){
  if(!S)return;
  const left=Math.max(0,S.left-(Date.now()-t0)),cnt=S.submitted.length;
  let h="<h1>🕵️ 이 TMI의 주인공은 누구?</h1>",btn="";
  if(S.phase==="collect"){
    h+=`<div class="card"><h2>📝 TMI 제출 (${cnt}/${S.N}명 완료)</h2>`;
    if(me)h+=`<div class="big ok">✅ TMI가 정상적으로 접수되었습니다!</div><p class="mut" style="text-align:center">당일까지 비밀 🤫</p>`;
    else h+=`<select id="nm"><option value="">내 이름 선택</option>${S.names.map(n=>`<option value="${n}" ${S.submitted.includes(n)?"disabled":""}>${n}${S.submitted.includes(n)?" (제출됨)":""}</option>`).join("")}</select><textarea id="tx" rows="3" maxlength="100" placeholder="나만의 의외의 TMI (예: 어릴 때 꿈은 마술사였다)"></textarea><p class="mut">⚠️ 개인정보·민감한 내용(연락처, 건강, 가족사 등)은 쓰지 마세요. 제출 후 수정할 수 없어요.</p><button id="sb" onclick="submit()">제출하기</button>`;
    h+=`</div><div class="card"><h2>제출 현황</h2>${S.names.map(n=>`<div class="row"><span>${n}</span><span>${S.submitted.includes(n)?"✅":"⏳"}</span></div>`).join("")}<p class="mut">누가 어떤 TMI를 냈는지는 서버에서도 기록되지 않아요.</p></div>`;
    btn=`<button class="alt" onclick="admin('start')" ${cnt>=S.N&&S.tmiCount>=S.N?"":"disabled"}>🚀 게임 시작 (${S.tmiCount}/${S.N})</button>`;
  }else if(S.phase==="play"){
    const i=S.idx;
    if(i>=S.N){h+=`<div class="card big">🎬 11문제 모두 끝!<br>정답 공개를 기다려 주세요</div>`;btn=`<button onclick="admin('reveal')">🎁 정답 공개!</button>`}
    else{if(lastQ!==i){lastQ=i;sel=null}
      const all=S.answered>=S.N||left<=0;
      h+=`<div class="bar"><i style="width:${(i+1)/S.N*100}%"></i></div><p class="mut" style="text-align:center">문제 ${i+1}/${S.N}</p><div class="card"><div class="big">${esc(S.text)}</div></div>`;
      if(!all){h+=`<div class="timer">⏱ ${Math.min(30,Math.ceil(left/1000))}</div>`;
        if(S.mine!==undefined&&S.mine!==null)h+=`<div class="card big ok">제출 완료! (${S.answered}/${S.N}명) 🤫</div>`;
        else if(me)h+=`<div class="grid">${S.names.map(n=>`<button class="${sel===n?"sel":""}" onclick="sel='${n}';render()">${n}</button>`).join("")}</div><button class="alt" ${sel?"":"disabled"} onclick="pick()">이 사람으로 제출</button>`;
        else h+=`<div class="card big">참여자만 답할 수 있어요</div>`}
      else{h+=`<div class="card big">🗣️ 왜 이 사람이라고 생각했나요?<br><span class="mut">한 명씩 선택한 인물과 이유를 말해 주세요</span></div>`;
        btn=`<button onclick="admin('next')">${i+1<S.N?"다음 문제 ▶":"마지막! 마무리 ▶"}</button>`}}
  }else{
    if(me&&!sentRev&&S.revealed<S.N){sentRev=true;api("reveal",{n:me.name,t:me.token,tmiId:me.tmiId,salt:me.salt}).then(r=>{if(!r.ok)sentRev=false})}
    if(!S.result)h+=`<div class="card big">정답을 모으는 중… ${S.revealed}/${S.N}<br><span class="mut">모두 이 화면을 켜 두세요</span></div>`;
    else{const {rows,qs}=S.result,top=rows[0].s,win=rows.filter(r=>r.s===top).map(r=>r.name);
      h+=`<div class="card"><div class="win">🏆 ${win.map(esc).join(", ")}${win.length>1?" 공동 우승":" 우승"}! (${top}점)</div></div><div class="card"><h2>순위</h2>${rows.map((r,i)=>`<div class="row"><span>${i+1}. ${esc(r.name)}</span><b>${r.s}/10점</b></div>`).join("")}</div><h2>정답 공개</h2>`;
      qs.forEach((q,i)=>{h+=`<div class="card"><div class="mut">문제 ${i+1}</div><div class="big">${esc(q.text)}</div><h2 style="text-align:center;color:var(--sec)">👉 ${esc(q.author||"?")}</h2>${rows.map(r=>{const d=r.det[i];return `<div class="row"><span>${esc(r.name)}</span><span class="${d.self?"mut":d.hit?"ok":"no"}">${d.self?"제외(본인)":d.hit?"⭕":"❌"}</span></div>`}).join("")}</div>`});
      if(!conf){conf=true;for(let k=0;k<40;k++){const c=document.createElement("div");c.className="conf";c.textContent=["🎉","🎊","✨","🏆"][k%4];c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),6000)}}}
  }
  h+=`<div class="card adm"><h2>🔧 관리자</h2><p class="mut">관리자 비밀번호가 필요해요. 일반 참가자는 누를 필요 없어요.</p>${btn}<button style="background:var(--mut)" onclick="admin('reset')">⚠️ 전체 초기화</button></div>`;
  const v1=$("tx")?$("tx").value:"",v2=$("nm")?$("nm").value:"";
  app.innerHTML=h;if(v1&&$("tx"))$("tx").value=v1;if(v2&&$("nm"))$("nm").value=v2;
}
poll();setInterval(poll,1200);
</script></body></html>
